apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: auto-pe-rw-caller
on:
  workflow_dispatch:
jobs:
  call-reusable:
    uses: .cloudbees/workflows/auto-pe-reusable-wf.yaml

  independent-job:
    steps:
      - name: Independent step
        uses: docker://alpine:3.19
        shell: sh
        run: echo "This job must succeed even when call-reusable is blocked by an RW policy"

  post-rw-job:
    needs:
      - call-reusable
    steps:
      - name: Post-RW step
        uses: docker://alpine:3.19
        shell: sh
        run: echo "This job must NOT execute when call-reusable was blocked"

