apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: auto-pe-staged-rw-caller
on:
  workflow_dispatch:
metadata:
  stages/v1alpha1:
    - name: Reusable Stage
      jobs:
        - call-reusable
    - name: Independent Stage
      jobs:
        - independent-job
    - name: Post Stage
      jobs:
        - post-rw-job
jobs:
  call-reusable:
    uses: .cloudbees/workflows/auto-pe-reusable-wf.yaml
  independent-job:
    steps:
      - run: echo "independent stage — no dependency on Reusable Stage"
        uses: docker://golang:1.20.3-alpine3.17
        name: Independent step
        shell: sh
  post-rw-job:
    needs:
      - call-reusable
    steps:
      - run: ' echo "post stage — only runs if call-reusable succeeded"'
        uses: docker://golang:1.20.3-alpine3.17
        name: Post RW step
        shell: sh
